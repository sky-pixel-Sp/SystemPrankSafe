name: Build SystemPrankSafe APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Include uploaded prank video when present
        shell: bash
        run: |
          VIDEO_FILE="$(find assets -maxdepth 1 -type f -iname '*.mp4' -print -quit)"
          if [ -n "$VIDEO_FILE" ]; then
            mkdir -p app/src/main/res/raw
            cp "$VIDEO_FILE" app/src/main/res/raw/prank_video.mp4
            echo "Bundled video: $VIDEO_FILE"
          else
            echo "No MP4 found in assets; app will use built-in animated fallback."
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemPrankSafe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
