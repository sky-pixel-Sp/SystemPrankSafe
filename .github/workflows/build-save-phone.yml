name: Build Save Phone APK

on:
  push:
    branches: [save-phone-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project
        run: tar -xJf Save-Phone-Android.tar.xz
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate source structure
        working-directory: Save-Phone-Android
        run: python3 tools/validate_project.py
      - name: Upload source project for review
        uses: actions/upload-artifact@v4
        with:
          name: Save-Phone-source-v1.1.0
          path: Save-Phone-Android/**
          if-no-files-found: error
          retention-days: 14
      - name: Build debug APK
        working-directory: Save-Phone-Android
        run: gradle --no-daemon clean assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Save-Phone-debug-apk
          path: Save-Phone-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
